name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed scopes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.scopes.outputs.web }}
      native: ${{ steps.scopes.outputs.native }}
      postgres: ${{ steps.scopes.outputs.postgres }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Classify changed paths
        id: scopes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            git diff-tree --no-commit-id --name-only -r "$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
          else
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
          fi
          node src/lib/ci/changed-scopes.mjs < "$RUNNER_TEMP/changed-files" >> "$GITHUB_OUTPUT"

  quality:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

  native-macos:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        working-directory: native-macos
    steps:
      - uses: actions/checkout@v4

      - name: Report Swift toolchain
        run: swift --version

      - name: Test native app
        run: swift test

      - name: Build release executable
        run: swift build --configuration release

  postgres-integration:
    name: PostgreSQL integration
    needs: changes
    if: needs.changes.outputs.postgres == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: yapper
          POSTGRES_PASSWORD: yapper
          POSTGRES_DB: yapper_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yapper -d yapper_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://yapper:yapper@localhost:5432/yapper_test
      DATABASE_URL_UNPOOLED: postgres://yapper:yapper@localhost:5432/yapper_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Apply migrations
        run: npm run db:migrate

      - name: Test PostgreSQL protocols
        run: npm run test:integration
